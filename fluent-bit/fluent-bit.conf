[SERVICE]
    Flush         1
    Log_Level     warn
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     ${FB_HTTP_PORT}

[INPUT]
    Name          tail
    Tag           nginx
    Path          ${LOG_DIR}/access.log
    Parser        nginx_rt
    Read_from_Head On
    DB            ${STATE_DIR}/tail-nginx.db

[INPUT]
    Name          tail
    Tag           app
    Path          ${LOG_DIR}/app.log
    Parser        app_json
    Read_from_Head On
    DB            ${STATE_DIR}/tail-app.db

[INPUT]
    Name          tail
    Tag           auth
    Path          ${LOG_DIR}/auth.log
    Parser        sshd
    Read_from_Head On
    DB            ${STATE_DIR}/tail-auth.db

# drop LB health checks: noise that costs storage
[FILTER]
    Name          grep
    Match         nginx
    Exclude       path ^/healthz$

# derive status class for a low-cardinality label (never label by IP/path!)
[FILTER]
    Name          lua
    Match         nginx
    Script        enrich.lua
    Call          enrich

[FILTER]
    Name          modify
    Match         *
    Add           env lab
    Add           host_role web

[OUTPUT]
    Name          loki
    Match         *
    Host          ${LOKI_HOST}
    Port          ${LOKI_PORT}
    Labels        job=$TAG, env=$env
    Label_Keys    $status_class,$level,$ssh_event
    Line_Format   json
    Remove_Keys   env

[OUTPUT]
    Name          file
    Match         *
    Path          ${STATE_DIR}
    File          archive.jsonl
    Format        plain
