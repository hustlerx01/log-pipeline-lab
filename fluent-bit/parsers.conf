[PARSER]
    Name        nginx_rt
    Format      regex
    Regex       ^(?<remote>[^ ]*) - (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+) (?<path>[^ ]*) \S*" (?<status>\d{3}) (?<size>\d+) "(?<referer>[^"]*)" "(?<agent>[^"]*)" (?<request_time>[\d.]+)$
    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z
    Types       status:integer size:integer request_time:float

[PARSER]
    Name        app_json
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        sshd
    Format      regex
    Regex       ^(?<time>\w{3} +\d+ \d+:\d+:\d+) (?<host>\S+) sshd\[(?<pid>\d+)\]: (?<ssh_event>Failed password|Accepted publickey|Accepted password|Invalid user)(?: for)?(?: invalid user)? (?<ssh_user>\S+) from (?<src_ip>[\d.]+) port (?<src_port>\d+)
    Time_Key    time
    Time_Format %b %d %H:%M:%S
