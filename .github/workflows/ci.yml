name: ci
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Install Fluent Bit + Loki
        run: |
          curl -fsSL https://raw.githubusercontent.com/fluent/fluent-bit/master/install.sh | sh
          curl -fsSL -o loki.zip https://github.com/grafana/loki/releases/download/v3.2.0/loki-linux-amd64.zip
          unzip loki.zip && sudo mv loki-linux-amd64 /usr/local/bin/loki
      - run: PATH=/opt/fluent-bit/bin:$PATH pytest -q
      - run: PATH=/opt/fluent-bit/bin:$PATH scripts/run_lab.sh
      - run: docker build -t fb-lab .
