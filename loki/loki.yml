auth_enabled: false
server: {http_listen_port: 3100, grpc_listen_port: 9096, log_level: warn}
common:
  path_prefix: /tmp/loki-lab
  storage: {filesystem: {chunks_directory: /tmp/loki-lab/chunks, rules_directory: /tmp/loki-lab/rules}}
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
schema_config:
  configs: [{from: 2024-01-01, store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}]
limits_config: {reject_old_samples: false, allow_structured_metadata: true}
ruler:
  storage: {type: local, local: {directory: ./loki/rules}}
  rule_path: /tmp/loki-lab/ruler-tmp
  evaluation_interval: 15s
  enable_api: true
analytics: {reporting_enabled: false}
