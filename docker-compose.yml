services:
  loggen:
    image: python:3.12-slim
    volumes: ["./gen:/gen:ro", "logs:/logs"]
    command: python /gen/generate_logs.py --out /logs
  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/loki.yml
    volumes: ["./loki/loki.yml:/etc/loki/loki.yml:ro", "./loki/rules:/loki/rules:ro"]
    working_dir: /
    ports: ["3100:3100"]
  fluent-bit:
    build: .
    depends_on: [loggen, loki]
    environment: {LOG_DIR: /logs, STATE_DIR: /state, LOKI_HOST: loki, LOKI_PORT: "3100", FB_HTTP_PORT: "2020"}
    volumes: ["logs:/logs:ro", "state:/state"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin}
volumes: {logs: {}, state: {}}
